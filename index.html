<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Школа № 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --blue: #1b7fb3; --blue-light: #36a3d6; --ink: #222; --text: #444; --bg: #fff; --soft: #f1f7fb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: "Nunito", "Segoe UI", Arial, sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
  :focus-visible { outline: 3px solid var(--blue-light); outline-offset: 3px; }

  header { background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.25); position: sticky; top: 0; z-index: 10; }
  .bar { max-width: 1100px; margin: 0 auto; padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .logo { font-size: 1.8rem; font-weight: 600; color: var(--blue-light); text-decoration: none; }
  .logo b { color: var(--blue); font-weight: 700; }
  nav ul { list-style: none; display: flex; gap: 26px; flex-wrap: wrap; }
  nav a { color: var(--blue); text-decoration: none; }
  nav a:hover { text-decoration: underline; }

  .hero { max-width: 1100px; margin: 0 auto; padding: 70px 24px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; min-height: 70vh; }
  .hero h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 800; color: var(--ink); line-height: 1.15; }
  .hero h1 span { color: var(--blue); }
  .hero p { margin: 20px 0 30px; max-width: 52ch; }
  .btn { border: 0; cursor: pointer; font: inherit; font-size: 1.05rem; color: #fff; padding: 12px 36px; border-radius: 30px; background: linear-gradient(180deg, var(--blue-light), var(--blue)); box-shadow: 0 6px 14px rgba(27,127,179,.45); }
  .btn:hover { filter: brightness(1.06); }
  .hero svg { width: 100%; max-width: 420px; justify-self: center; }

  #options { background: var(--soft); padding: 60px 24px; }
  .inner { max-width: 1100px; margin: 0 auto; }
  #options h2 { font-size: 2rem; color: var(--ink); margin-bottom: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; }
  .card { font: inherit; text-align: left; cursor: pointer; background: #fff; border: 2px solid transparent; border-radius: 14px; padding: 22px; box-shadow: 0 4px 12px rgba(0,0,0,.08); color: var(--text); }
  .card strong { display: block; font-size: 1.25rem; color: var(--blue); margin-bottom: 4px; }
  .card:hover, .card[aria-expanded="true"] { border-color: var(--blue-light); }
  #panel { margin-top: 28px; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  #panel h3 { color: var(--ink); font-size: 1.5rem; margin-bottom: 10px; }
  #panel p { margin-bottom: 8px; max-width: 70ch; }
  #panel a { color: var(--blue); }
  table { border-collapse: collapse; margin-top: 8px; }
  td { padding: 6px 24px 6px 0; border-bottom: 1px solid #e2e8ec; }

  footer { text-align: center; padding: 22px; font-size: .9rem; color: #777; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; padding: 40px 24px; min-height: 0; }
    .hero svg { order: -1; max-width: 280px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="#top">Шко<b>ла</b> №1</a>
    <nav aria-label="Меню">
      <ul>
        <li><a href="#top">Главная</a></li>
        <li><a href="#options">О школе</a></li>
        <li><a href="#options">Новости</a></li>
        <li><a href="#options">Расписание</a></li>
        <li><a href="#options">Контакты</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div>
      <h1>НАША <span>Школа</span><br>ЖДЁТ ВАС</h1>
      <p>Современное образование, внимательные учителя и дружная школьная жизнь с 1-го по 11-й класс. Замените этот текст на описание вашей школы.</p>
      <button class="btn" id="more" aria-controls="options" aria-expanded="false">Узнать больше</button>
    </div>

    <svg viewBox="0 0 400 340" role="img" aria-label="Здание школы">
      <ellipse cx="200" cy="312" rx="170" ry="16" fill="#dbe9f1"/>
      <rect x="50" y="130" width="300" height="180" rx="6" fill="#1b7fb3"/>
      <polygon points="30,135 200,50 370,135" fill="#14638c"/>
      <rect x="170" y="215" width="60" height="95" rx="4" fill="#fff"/>
      <circle cx="200" cy="108" r="22" fill="#fff"/>
      <path d="M200 94v15l10 6" stroke="#1b7fb3" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g fill="#bfe3f5">
        <rect x="75" y="160" width="50" height="45" rx="3"/><rect x="275" y="160" width="50" height="45" rx="3"/>
        <rect x="75" y="235" width="50" height="45" rx="3"/><rect x="275" y="235" width="50" height="45" rx="3"/>
      </g>
      <line x1="200" y1="50" x2="200" y2="20" stroke="#14638c" stroke-width="4"/>
      <polygon points="200,20 232,31 200,42" fill="#f2c230"/>
    </svg>
  </section>

  <section id="options" hidden>
    <div class="inner">
      <h2>Что вас интересует?</h2>
      <div class="cards" id="cards">
        <button class="card" data-id="about" aria-expanded="false"><strong>О школе</strong>История и достижения</button>
        <button class="card" data-id="news" aria-expanded="false"><strong>Новости</strong>События школы</button>
        <button class="card" data-id="schedule" aria-expanded="false"><strong>Расписание</strong>Звонки и уроки</button>
        <button class="card" data-id="contacts" aria-expanded="false"><strong>Контакты</strong>Как с нами связаться</button>
      </div>
      <div id="panel" aria-live="polite" hidden></div>
    </div>
  </section>
</main>

<footer>© 2026 Школа № 1</footer>

<script>
  var content = {
    about: '<h3>О школе</h3><p>Школа основана в 1985 году. Сейчас здесь учатся около 650 детей, работают 48 учителей и 20 кружков и секций.</p><p>Замените этот текст на историю и миссию вашей школы.</p>',
    news: '<h3>Новости</h3><p><b>1 октября</b> — День учителя: концерт и поздравления от учеников.</p><p><b>20 сентября</b> — наши ученики заняли призовые места на олимпиаде по математике.</p><p><b>1 сентября</b> — торжественная линейка, начало учебного года.</p>',
    schedule: '<h3>Расписание звонков</h3><table><tr><td>1 урок</td><td>08:30 – 09:15</td></tr><tr><td>2 урок</td><td>09:25 – 10:10</td></tr><tr><td>3 урок</td><td>10:25 – 11:10</td></tr><tr><td>4 урок</td><td>11:25 – 12:10</td></tr><tr><td>5 урок</td><td>12:25 – 13:10</td></tr><tr><td>6 урок</td><td>13:20 – 14:05</td></tr></table>',
    contacts: '<h3>Контакты</h3><p>г. Ваш город, ул. Школьная, 1</p><p>Телефон: <a href="tel:+380000000000">+38 (000) 000-00-00</a></p><p>Эл. почта: <a href="mailto:school@example.com">school@example.com</a></p><p>Приёмная: пн–пт, 9:00–16:00</p>'
  };

  var options = document.getElementById('options');
  var panel = document.getElementById('panel');
  var more = document.getElementById('more');
  var cards = document.querySelectorAll('.card');

  more.addEventListener('click', function () {
    options.hidden = false;
    more.setAttribute('aria-expanded', 'true');
    options.scrollIntoView({ behavior: 'smooth' });
  });

  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      cards.forEach(function (c) { c.setAttribute('aria-expanded', 'false'); });
      card.setAttribute('aria-expanded', 'true');
      panel.innerHTML = content[card.dataset.id];
      panel.hidden = false;
    });
  });

  document.querySelectorAll('nav a[href="#options"]').forEach(function (a, i) {
    a.addEventListener('click', function () {
      options.hidden = false;
      cards[i].click();
    });
  });
</script>
</body>
</html>
